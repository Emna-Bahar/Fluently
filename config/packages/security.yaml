security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\GoogleAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_default_redirect

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    access_control:
    # Public routes
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/connect/google, roles: PUBLIC_ACCESS }
    - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
    - { path: ^/forgot-password/code, roles: PUBLIC_ACCESS }
    - { path: ^/face-setup, roles: PUBLIC_ACCESS }
    - { path: ^/face-verify, roles: PUBLIC_ACCESS }

    # Authenticated routes
    - { path: ^/face-verify-page, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/face-success, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/profile, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/dashboard, roles: ROLE_ADMIN }
    - { path: ^/, roles: ROLE_USER }